[package]
name = "symposiast-registry-site"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
stucco = { version = "=0.2.1", default-features = false, features = ["layout", "typography", "actions", "data"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
