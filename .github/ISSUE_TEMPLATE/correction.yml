name: Report a guidance correction
description: Report an incorrect finding, recipe, citation, or installation behavior.
title: "[Correction] "
body:
  - type: input
    id: entry
    attributes:
      label: Entry and release
      description: Entry path, crate/version, and registry commit if known.
    validations:
      required: true
  - type: input
    id: item
    attributes:
      label: Finding or recipe
      description: ID or link to the affected guidance.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Explain the correction and include supporting sources if available.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and environment
      description: Minimal code or commands, features, target, and toolchain. Omit secrets and private code.
  - type: textarea
    id: fix
    attributes:
      label: Suggested fix
      description: Optional proposed change or related pull request.
