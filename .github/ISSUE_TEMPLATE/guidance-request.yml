name: Request crate guidance
description: Ask for a crate, release, or recipe to be covered.
title: "[Request] "
body:
  - type: markdown
    attributes:
      value: Search existing issues first. A request needs no generated bundle and does not promise a delivery date.
  - type: input
    id: crate
    attributes:
      label: Crate and release
      description: Exact crates.io package name and version, or explain that you need help choosing.
      placeholder: "your-crate 1.2.3"
    validations:
      required: true
  - type: input
    id: upstream
    attributes:
      label: Upstream links
      description: Link to crates.io and the source repository.
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Tasks and recipes
      description: What should the guidance help you build or understand?
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Features and constraints
      description: Feature flags, platform, related crates, or compatibility needs.
  - type: textarea
    id: evidence
    attributes:
      label: Useful sources and testing help
      description: Link docs or examples and say whether you can help test. Do not include secrets or private code.
